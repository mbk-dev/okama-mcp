[project]
name = "okama-mcp"
version = "3.0.0"
description = "MCP (Model Context Protocol) server exposing the okama investment portfolio toolkit to AI assistants"
authors = [{ name = "Sergey Kikevich", email = "sergey@rostsber.ru" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0.0"
keywords = ["mcp", "okama", "investments", "portfolio", "finance", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "okama>=4.0.0",
    "fastmcp>=4.0.11,<5",
    "pydantic>=2.0",
    "scipy>=1.11",
    "okama-planner[reports]>=0.4.0,<0.5.0",
]

[project.urls]
Homepage = "https://mcp.okama.io"
Repository = "https://github.com/mbk-dev/okama-mcp"

[project.scripts]
okama-mcp = "okama_mcp.transport:main"

[dependency-groups]
test = ["pytest", "pytest-asyncio"]
dev = ["ruff"]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okama_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/okama_mcp",
    "/examples",
    "/docs",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/requirements.txt",
]

[tool.ruff]
line-length = 120
extend-exclude = [".ipynb_checkpoints", "env", ".env"]
target-version = "py311"

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: live test that hits api.okama.io (slow, network-dependent)",
]
addopts = "-m 'not integration' --basetemp=tmp/pytest"
