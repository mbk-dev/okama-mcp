name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install
      - name: Check out the privacy-capable Planner companion
        uses: actions/checkout@v5
        with:
          repository: mbk-dev/okama-planner
          ref: 588be5855cfaebddb6725c3f4f4126a3fda72a56
          path: tmp/planner-companion
      - name: Run unit tests with the pinned Planner source
        env:
          PYTHONPATH: ${{ github.workspace }}/tmp/planner-companion/src:${{ github.workspace }}/src
        run: poetry run pytest -q
      - name: Ruff
        run: poetry run ruff check .
