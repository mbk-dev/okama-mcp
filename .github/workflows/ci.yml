name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run unit tests with the published Planner companion
        run: uv run --no-sync pytest -q
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Build and test the installed wheel with published dependencies
        run: |
          uv build
          uv venv tmp/installed
          uv pip install --python tmp/installed/bin/python dist/*.whl
          tmp/installed/bin/python -I tests/release/published_pair.py --fixtures examples/planner --output tmp/published-pair
