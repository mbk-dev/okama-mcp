name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version consistency (tag = pyproject = server.json)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          SERVER_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "tag=$TAG_VERSION pyproject=$PYPROJECT_VERSION server.json=$SERVER_VERSION pkg=$PKG_VERSION"
          test "$TAG_VERSION" = "$PYPROJECT_VERSION" || { echo "::error::pyproject.toml version differs from tag"; exit 1; }
          test "$TAG_VERSION" = "$SERVER_VERSION"    || { echo "::error::server.json version differs from tag"; exit 1; }
          test "$TAG_VERSION" = "$PKG_VERSION"       || { echo "::error::server.json packages[0].version differs from tag"; exit 1; }
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
      - name: Build sdist and wheel
        run: uv build
      - name: Verify published companion and installed MCP wheel before release
        env:
          MPLBACKEND: Agg
        run: |
          uv sync --all-groups
          uv run --no-sync pytest -q
          uv run --no-sync ruff check .
          uv venv tmp/installed
          uv pip install --python tmp/installed/bin/python dist/*.whl
          tmp/installed/bin/python -I tests/release/published_pair.py --fixtures examples/planner --output tmp/published-pair
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
      - name: Install the exact published pair and verify real stdio
        env:
          MPLBACKEND: Agg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv venv tmp/pypi
          uv pip install --python tmp/pypi/bin/python "okama-mcp==$VERSION"
          tmp/pypi/bin/python -I tests/release/published_pair.py --fixtures examples/planner --output tmp/pypi-acceptance
