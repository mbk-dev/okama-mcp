# Orca per-repo configuration, committed so every worktree is set up the same way.
# `scripts.setup` runs in every freshly created worktree, with the worktree as CWD.
scripts:
  setup: |
    set -euo pipefail
    # poetry and the pinned interpreter live in ~/.local/bin, which a
    # non-login setup shell may not have on PATH.
    export PATH="$HOME/.local/bin:$PATH"
    # `.python-version` is inert without pyenv; select the setup interpreter
    # explicitly while preserving the package's supported Python range.
    poetry env use python3.14
    poetry install
